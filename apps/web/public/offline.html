<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <title>DP Code — Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0b0c;
        color: #e8e8ea;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", system-ui, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 1rem;
        padding: max(2rem, env(safe-area-inset-top)) 1.5rem
          max(2rem, env(safe-area-inset-bottom));
      }
      img {
        width: 84px;
        height: 84px;
        border-radius: 20px;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0;
      }
      p {
        margin: 0;
        max-width: 28ch;
        color: #a1a1aa;
        line-height: 1.5;
      }
      button {
        margin-top: 0.5rem;
        appearance: none;
        border: 1px solid #2a2a2e;
        background: #161618;
        color: #e8e8ea;
        font: inherit;
        font-weight: 500;
        padding: 0.7rem 1.4rem;
        min-height: 44px;
        border-radius: 12px;
        cursor: pointer;
      }
      button:active {
        background: #202024;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/dpcode.png" alt="DP Code" />
      <h1>You're offline</h1>
      <p>DP Code needs a connection to your coding-agent server. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
